# 个人 fork 专用的桌面安装包构建流程（不要提交给上游 t8y2/dbx）。
#
# 文件名和 Actions 列表里的名字仍叫 "Fork build (Windows x64)"：GitHub 只登记默认分支上的
# 工作流，改名需要再动 fork 的 main，所以保留原名，实际内容是 Windows + macOS 两个作业。
#
# 用法：Actions -> "Fork build (Windows x64)" -> Run workflow -> 选分支和 platform：
#   windows  只构建 Windows x64 NSIS 安装包（默认）
#   macos    只构建 macOS .dmg（Apple 芯片 arm64 + Intel x64 各一个）
#   all      两个平台都构建
# 跑完后在该次运行页面底部的 Artifacts 下载：
#   dbx-windows-x64-setup / dbx-macos-arm64-dmg / dbx-macos-x64-dmg
#
# 与上游 release.yml 的区别：没有签名证书，不公证，不生成更新器产物，不发 Release，只上传构建产物。
# macOS 侧用 ad-hoc 临时签名；没有公证意味着 Gatekeeper 仍会拦首次启动，需要在
# "系统设置 -> 隐私与安全性" 里点"仍要打开"，或执行 xattr -d com.apple.quarantine <文件>。

name: Fork build (Windows x64)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要构建的平台 / Platform to build
        type: choice
        options:
          - windows
          - macos
          - all
        default: windows

permissions:
  contents: read

jobs:
  build-windows:
    if: github.event.inputs.platform != 'macos'
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: "0"
      # 与上游一致：Windows 可执行文件保留 8 MiB 栈。
      RUSTFLAGS: -C link-arg=/STACK:8388608
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      # `pnpm tauri build` 在 Windows 上会经 cmd.exe 重新拼命令行，内联 JSON 的双引号会被吃掉，
      # 所以把覆盖配置写成文件，只传路径。
      - name: Write unsigned Tauri config override
        shell: pwsh
        run: >-
          Set-Content -Path "$env:RUNNER_TEMP\tauri.fork-unsigned.conf.json"
          -Value '{"bundle":{"createUpdaterArtifacts":false}}'
          -Encoding utf8 -NoNewline

      - name: Build Tauri app (unsigned, no updater artifacts)
        shell: pwsh
        run: >-
          pnpm tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config "$env:RUNNER_TEMP\tauri.fork-unsigned.conf.json"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dbx-windows-x64-setup
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    if: github.event.inputs.platform != 'windows'
    name: build-macos (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    env:
      CARGO_INCREMENTAL: "0"
      # "-" 是 ad-hoc 临时签名：没有开发者证书时 Tauri 的标准做法。
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          cache-on-failure: true

      - name: Write Tauri config override
        shell: bash
        run: >
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}'
          > "$RUNNER_TEMP/tauri.fork-unsigned.conf.json"

      - name: Build Tauri app (ad-hoc signed, no updater artifacts)
        shell: bash
        run: >
          pnpm tauri build
          --target ${{ matrix.target }}
          --bundles dmg
          --config "$RUNNER_TEMP/tauri.fork-unsigned.conf.json"

      - name: Show bundle contents and signature
        shell: bash
        run: |
          ls -la "target/${{ matrix.target }}/release/bundle/dmg"
          codesign -dv --verbose=2 "target/${{ matrix.target }}/release/bundle/macos/"*.app 2>&1 | head -20 || true

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: dbx-macos-${{ matrix.arch }}-dmg
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
